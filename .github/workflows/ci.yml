name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hooks:
    name: ${{ matrix.os }} / hooks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # So Linux (DM-228). No Git Bash a suite passa de 20 min e e cancelada sem
    # resultado: o job nao dava sinal nenhum, gastava runner e deixava um X que
    # todo mundo aprende a ignorar. O Windows e conferido localmente (`teste.sh`
    # ja se adapta ao MSYS); um job Windows de fumaca, curto, e trabalho proprio.
    # O nome `ubuntu-latest / hooks` fica: e o check exigido pelo ruleset do main.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure jq on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Ensure jq on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            choco install jq -y --no-progress
          }

      - name: Run hook suite
        shell: bash
        run: bash .claude/hooks/teste.sh

  r1:
    name: r1 / reconciliacao-base
    runs-on: ubuntu-latest
    # A bancada R1 (`todos`) leva ~6 min no runner (1423 ok no PR que criou o
    # job). Job proprio, em paralelo ao `hooks`, para nao somar ao tempo dele e
    # dar sinal separado. Sem matrix: um so `todos` usa o despacho da propria
    # bancada (grupo ou parte nova entra sozinho) e da uma contagem unica.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure jq
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Run R1 bench
        shell: bash
        run: bash scripts/ci/test-r1-reconciliacao-base.sh todos

  contract:
    name: contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed lines
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif git rev-parse --verify --quiet 'HEAD^' >/dev/null; then
            git diff --check HEAD^..HEAD
          else
            # Root commit: no HEAD^ exists, so check the whole commit against the empty tree.
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

      - name: Check canonical skill origins
        shell: bash
        run: bash scripts/ci/test-proveniencia.sh

      - name: Test provenance guard contract
        shell: bash
        run: bash scripts/ci/test-proveniencia-contrato.sh

      - name: Validate Mergex contract
        shell: bash
        run: bash scripts/ci/validate-mergex-contract.sh

      - name: Validate review evidence contract
        shell: bash
        run: bash scripts/ci/validate-review-evidence-contract.sh

      - name: Guard that CI runs every validator
        shell: bash
        run: bash scripts/ci/check-ci-runs-validators.sh

      - name: Test the CI guard
        shell: bash
        run: bash scripts/ci/test-ci-guard.sh

      - name: Test E7 fatiamento
        shell: bash
        run: bash scripts/ci/test-fatiamento-e7.sh

      - name: Test the expx nucleo copy used by the tests
        shell: bash
        run: bash scripts/ci/test-nucleo-expx.sh

      - name: Test the project config reader (.expx/fatiamento.json)
        shell: bash
        run: bash scripts/ci/test-leitor-do-projeto.sh

      - name: Test E2 V12
        shell: bash
        run: bash scripts/ci/test-portao-v12.sh

      - name: Test E1 evidencia de revisao por task
        shell: bash
        run: bash scripts/ci/test-e1-evidencia-revisao.sh

      - name: Test E9 R4 PR head from the base repository
        shell: bash
        run: bash scripts/ci/test-r4-cabeca-do-pr.sh

      - name: Test E9 feature redirecionada
        shell: bash
        run: bash scripts/ci/test-e9-redirecionamento.sh

      - name: Test PR de planejamento
        shell: bash
        run: bash scripts/ci/test-pr-de-planejamento.sh
